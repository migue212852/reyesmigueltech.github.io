name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public documents
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/public-documents"
          mkdir -p "$output"
          find docs -type f \( \
            -iname '*.pdf' -o \
            -iname '*.ppt' -o \
            -iname '*.pptx' -o \
            -iname '*.pptm' -o \
            -iname '*.pps' -o \
            -iname '*.ppsx' -o \
            -iname '*.odp' \
          \) -exec cp --parents -- {} "$output" \;
          count=$(find "$output" -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No approved PDF or presentation files found under docs/; refusing to deploy."
            exit 1
          fi
          echo "Staged $count public document(s)."
      - name: Upload documents only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-documents
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
